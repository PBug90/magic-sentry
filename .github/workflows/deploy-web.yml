name: Deploy web

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pbug90/magic-sentry-web:${{ github.sha }}
            ghcr.io/pbug90/magic-sentry-web:latest
          build-args: |
            VITE_EXTENSION_URL=${{ vars.VITE_EXTENSION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read   # required so the VPS docker login can pull from GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose + Caddyfile to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile \
              deploy@${VPS_HOST}:/opt/magic-sentry/

      - name: Pull image and restart
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # shellcheck disable=SC2086
          ssh deploy@${VPS_HOST} \
            IMAGE_TAG=${IMAGE_TAG} \
            GHCR_TOKEN=${GHCR_TOKEN} \
            GHCR_USER=${GHCR_USER} \
            bash <<'EOF'
              set -euo pipefail
              cd /opt/magic-sentry
              # Persist IMAGE_TAG for out-of-band `docker compose` calls (rollback, ps, logs).
              echo "IMAGE_TAG=$IMAGE_TAG" > .compose.env
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              docker compose --env-file .compose.env pull web
              docker compose --env-file .compose.env up -d
              docker logout ghcr.io
              docker image prune -f
          EOF

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --max-time 10 https://magicsentry.pro/ > /dev/null; then
              echo "Healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1
