name: Build web image
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pbug90/magic-sentry-web:${{ github.sha }}
            ghcr.io/pbug90/magic-sentry-web:latest
          build-args: |
            VITE_EXTENSION_URL=${{ vars.VITE_EXTENSION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print deploy command
        run: |
          echo "::notice title=Image pushed::ghcr.io/pbug90/magic-sentry-web:${{ github.sha }}"
          echo "::notice title=Next step::Run 'Deploy magic-sentry' in bughub-hosting with image_tag=${{ github.sha }}"
