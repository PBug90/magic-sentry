name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-cli:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone web view
        run: npm run build:standalone

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/magic-sentry.exe
          generate_release_notes: true

  build-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Build twitch extension
        run: npm run build:extension

      - name: Zip extension
        run: |
          cd twitch-extension/dist
          zip -r ../../twitch-extension.zip .

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: twitch-extension.zip

  build-web-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pbug90/magic-sentry-web:${{ github.sha }}
            ghcr.io/pbug90/magic-sentry-web:${{ github.ref_name }}
            ghcr.io/pbug90/magic-sentry-web:latest
          build-args: |
            VITE_EXTENSION_URL=${{ vars.VITE_EXTENSION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print deploy command
        run: |
          echo "::notice title=Image pushed::ghcr.io/pbug90/magic-sentry-web:${{ github.sha }}"
