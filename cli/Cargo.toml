[package]
name = "magic-sentry"
version = "0.1.0"
edition = "2021"
description = "Magic Sentry - WarCraft III Live Game Data Tracker"

[dependencies]
warcraft3-stats-observer = { git = "https://github.com/PBug90/Warcraft3StatsObserverRs", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.27"
ureq = { version = "2", features = ["json"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tiny_http = "0.12"

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"
